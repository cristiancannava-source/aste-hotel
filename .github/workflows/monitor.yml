name: monitor-aste-hotel

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "monitor"
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      - name: Ripristina database dalla cache
        uses: actions/cache@v4
        with:
          path: data.sqlite
          key: aste-db-${{ github.run_id }}
          restore-keys: aste-db-
      - name: Costruisci config dai secret
        run: |
          mkdir -p config
          cat > config/settings.toml <<EOF
          sources = ["pvp","fallcoaste","astegiudiziarie","astalegale"]
          [filters]
          min_price = 0
          regions = []
          only_future = true
          [telegram]
          token = "${{ secrets.TG_TOKEN }}"
          chat_id = "${{ secrets.TG_CHAT_ID }}"
          [email]
          host = "smtp.gmail.com"
          port = 587
          user = "${{ secrets.MAIL_USER }}"
          password = "${{ secrets.MAIL_PASS }}"
          to = ["${{ secrets.MAIL_TO }}"]
          cc = ["c.cannava@londonfs.co.uk"]
          EOF
      - name: Primo giro silenzioso se database assente
        run: |
          if [ ! -f data.sqlite ]; then
            echo "Database assente: popolo in silenzio"
            python -c "
          from pathlib import Path
          from aste_hotel.core.store import Store
          from aste_hotel.sources.pvp import PvpSource
          from aste_hotel.sources.fallcoaste import FallcoasteSource
          from aste_hotel.sources.astegiudiziarie import AstegiudiziarieSource
          from aste_hotel.sources.astalegale import AstalegaleSource
          store = Store(Path('data.sqlite'))
          for S in (PvpSource, FallcoasteSource, AstegiudiziarieSource, AstalegaleSource):
              try:
                  nuovi = store.process(S().fetch())
                  store.mark_notified([l.uid for l in nuovi])
              except Exception as e:
                  print('errore', S.__name__, e)
          print('popolamento iniziale completato')
          "
          fi
      - name: Esegui il monitor
        run: python -m aste_hotel.run
      - name: Commit data_hotel.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data_hotel.json || true
          git commit -m "aggiorna dati alberghi [skip ci]" || echo "nessuna modifica"
          git pull --rebase --autostash || true
          git push || echo "push fallito, riprovo al prossimo giro"
      - name: Genera dashboard (alberghi + zone)
        run: |
          mkdir -p site
          python -c "
          from aste_hotel.dashboard import carica_json, genera_html, HOTEL_JSON, ZONE_JSON
          html = genera_html(carica_json(HOTEL_JSON), carica_json(ZONE_JSON))
          open('site/index.html','w',encoding='utf-8').write(html)
          print('dashboard a 3 tab generata')
          "
      - name: Salva database in cache
        uses: actions/cache/save@v4
        with:
          path: data.sqlite
          key: aste-db-${{ github.run_id }}
      - name: Pubblica dashboard su Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
